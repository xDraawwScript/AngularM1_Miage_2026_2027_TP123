<header>
  <div>
    <b>Guitar Practice Cloud</b>
    <small>Le cloud qui manque à votre ampli</small>
  </div>
  <nav aria-label="Navigation principale">
    @if (auth.currentUser(); as user) {
      <span class="username">{{ user.name }}</span>
    }
    <a routerLink="/tracks" routerLinkActive="active-link">Backing tracks</a>
    @if (auth.token()) {
      <a routerLink="/profile" routerLinkActive="active-link">Profil</a>
      <button type="button" (click)="logout()">Déconnexion</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active-link">Connexion</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
