<label class="ds-field">
  <span class="ds-label">Titre</span>
  <input [formControl]="title" />
</label>
<label class="ds-field">
  <span class="ds-label">Fichier audio</span>
  <input type="file" accept="audio/*" [disabled]="uploading()" (change)="choose($event)" />
</label>

@if (error()) {
  <p class="error" role="alert">{{ error() }}</p>
}
@if (success()) {
  <p class="success" role="status">✓ {{ success() }}</p>
}
@if (uploading()) {
  <div class="upload-progress" role="status" aria-live="polite">
    <progress [attr.value]="progress()" max="100" aria-label="Progression de l'envoi"></progress>
    <span>
      @if (progress() === null) {
        Envoi…
      } @else if (progress() === 100) {
        Traitement…
      } @else {
        {{ progress() }} %
      }
    </span>
  </div>
}

<button type="button" class="ds-btn" (click)="upload()" [disabled]="!file() || uploading()">
  @if (uploading()) {
    <span class="spinner"></span> Envoi…
  } @else {
    Envoyer
  }
</button>
