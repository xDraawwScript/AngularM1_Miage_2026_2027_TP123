<section class="screen">
  <app-trident class="trident" />
  <app-dots class="dots" />
  <h1>Créer un compte</h1>

  <div class="panel">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label class="ds-field">
        <span class="ds-label">Nom</span>
        <input formControlName="name" placeholder="Votre nom" />
        @if (form.controls.name.invalid && form.controls.name.touched) {
          <small class="field-error">Nom requis</small>
        }
      </label>
      <label class="ds-field">
        <span class="ds-label">Email</span>
        <input type="email" formControlName="email" placeholder="vous@exemple.com" />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <small class="field-error">Email invalide</small>
        }
      </label>
      <label class="ds-field">
        <span class="ds-label">Mot de passe</span>
        <input type="password" formControlName="password" placeholder="8 caractères minimum" />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <small class="field-error">Mot de passe requis (8 caractères minimum)</small>
        }
      </label>
      <button type="submit" class="ds-btn" [disabled]="form.invalid || submitting()">
        @if (submitting()) {
          <span class="spinner"></span> Création…
        } @else {
          Créer mon compte
        }
      </button>
    </form>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
    <p><a class="ds-link" routerLink="/login">Déjà inscrit ?</a></p>
  </div>
</section>
