<section class="field">
  <div class="shard"></div>

  <div class="panel">
    <h1>Créer un compte</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Nom
        <input formControlName="name" />
        @if (form.controls.name.invalid && form.controls.name.touched) {
          <small class="field-error">Nom requis</small>
        }
      </label>
      <label>
        Email
        <input type="email" formControlName="email" />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <small class="field-error">Email invalide</small>
        }
      </label>
      <label>
        Mot de passe
        <input type="password" formControlName="password" />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <small class="field-error">Mot de passe requis (8 caractères minimum)</small>
        }
      </label>
      <button type="submit" [disabled]="form.invalid">Créer mon compte</button>
    </form>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <p><a routerLink="/login">Déjà inscrit ?</a></p>
  </div>
</section>
