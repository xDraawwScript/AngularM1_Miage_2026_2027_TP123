<section class="wall">
  <h1>Connexion</h1>

  <div class="flyer">
    <span class="tape tape-left"></span>
    <span class="tape tape-right"></span>
    <span class="stamp">ACCÈS</span>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Email
        <input type="email" formControlName="email" />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <small class="field-error">Email invalide</small>
        }
      </label>
      <label>
        Mot de passe
        <input type="password" formControlName="password" />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <small class="field-error">Mot de passe requis</small>
        }
      </label>
      <button type="submit" [disabled]="form.invalid || submitting()">
        @if (submitting()) {
          <span class="spinner"></span> Connexion…
        } @else {
          Se connecter
        }
      </button>
    </form>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <p><a routerLink="/register">Créer un compte</a></p>
  </div>
</section>
