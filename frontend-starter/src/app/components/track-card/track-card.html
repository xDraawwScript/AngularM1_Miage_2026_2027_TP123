<article class="track-card" [class.playing]="playing()">
  <h3>{{ track().title }}</h3>
  <p class="original">{{ track().originalName }}</p>

  <dl class="specs">
    <div><dt>Format</dt><dd>{{ audioFormatLabel(track().mimeType) }}</dd></div>
    <div><dt>Taille</dt><dd>{{ formatSize(track().size) }}</dd></div>
    <div><dt>Ajouté le</dt><dd>{{ formatDate(track().createdAt) }}</dd></div>
  </dl>

  <div class="track-actions">
    <button
      type="button"
      class="play"
      (click)="playRequested.emit(track())"
      [attr.aria-label]="(playing() ? 'Mettre en pause ' : 'Lire ') + track().title"
    >
      {{ playing() ? 'Pause' : 'Lire' }}
    </button>
    <button
      type="button"
      class="delete"
      (click)="removeRequested.emit(track())"
      [attr.aria-label]="'Supprimer ' + track().title"
    >
      ×
    </button>
  </div>
</article>
