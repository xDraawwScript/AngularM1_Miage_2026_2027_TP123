<section class="screen">
  <app-trident class="trident" />

  <div class="content">
    <span class="ds-tag">Dossier</span>
    <h1>Mon profil</h1>

    <button type="button" class="ds-btn-ghost reload" (click)="load()" [disabled]="loading()">
      @if (loading()) {
        <span class="spinner"></span> Chargement…
      } @else {
        Charger mon profil
      }
    </button>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    @if (loading() && !auth.currentUser()) {
      <div class="skeleton-specs">
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
      </div>
    }

    @if (auth.currentUser(); as user) {
      <dl class="specs">
        <div class="row">
          <dt class="ds-label">Nom</dt>
          <dd>{{ user.name }}</dd>
        </div>
        <div class="row">
          <dt class="ds-label">Email</dt>
          <dd>{{ user.email }}</dd>
        </div>
        <div class="row">
          <dt class="ds-label">Membre depuis</dt>
          <dd>{{ user.createdAt.slice(0, 10) }}</dd>
        </div>
      </dl>

      <form [formGroup]="form" (ngSubmit)="save()">
        <label class="ds-field">
          <span class="ds-label">Nouveau nom</span>
          <input formControlName="name" />
        </label>
        <button type="submit" class="ds-btn" [disabled]="form.invalid || saving()">
          @if (saving()) {
            <span class="spinner"></span> Enregistrement…
          } @else {
            Enregistrer
          }
        </button>
        @if (saved()) {
          <span class="saved-tag">✓ Enregistré</span>
        }
      </form>
    }
  </div>
</section>
